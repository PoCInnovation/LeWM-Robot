# ═══════════════════════════════════════════════════════════════
# Configuration par défaut du projet WM-LeRobot
# ═══════════════════════════════════════════════════════════════
# Surchargeable via CLI : python script.py --config configs/custom.yaml

# Configuration de l'encodeur (DINOv3 ou DINOv2)
encoder:
  family: "dinov3"                      # "dinov3" (Meta, GATED) / "dinov2" (public fallback)
  size: "small"                         # "small" (21M) / "base" (86M) / "large" (300M) / "giant" (1.1B)
  image_size: 224
  # NB : patch_size et register tokens sont lus depuis le modèle chargé
  # (DINOv2 = patch 14 → 256 patches ; DINOv3 = patch 16 + 4 registres).

# Configuration du dataset LeRobot HuggingFace
dataset:
  # HF repo id, OU chemin local (OBLIGATOIRE en mode offline sur cluster —
  # lerobot ne résout pas un repo_id Hub sans réseau, même en cache)
  hf_id: "divisio74/duck_dataset_v3"
  wrist_key:   "observation.images.wrist"
  global_key:  "observation.images.front"  # duck dataset : "front", pas "global"
  action_key:  "action"
  proprio_key: "observation.state"
  # delta par défaut pour le training (surcharge : 04 --delta N).
  # À 30 fps, delta=1 rend "copier z_t" quasi optimal → surveiller la
  # baseline identité dans les logs de 04/05.
  delta_timesteps: 2
  cache_dir: null                       # null = défaut HF
  val_fraction: 0.2                     # split PAR ÉPISODE

# Stratégies comparées par scripts/03_compare_fusion.py
fusion:
  strategies_to_test:
    - "concat"
    - "concat_view"
    - "cross_attn_bd"
    - "late_cls"

# Entraînement du probe (03_compare_fusion)
probe:
  n_epochs: 30
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  hidden_dim: 512

# Reproductibilité
seed: 42

# Paths (relatifs au root du repo)
paths:
  # Dossier racine des datasets encodés (le nom final inclut dataset+encodeur)
  encoded_data: "results/encoded"
