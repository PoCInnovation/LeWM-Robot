# ═══════════════════════════════════════════════════════════════
# Configuration par défaut du projet WM-LeRobot
# ═══════════════════════════════════════════════════════════════
# Surchargeable via CLI : python script.py --config configs/custom.yaml

# Configuration de l'encodeur (DINOv3 ou DINOv2)
encoder:
  family: "dinov3"                      # "dinov3" (Meta, validé) / "dinov2" (public fallback)
  size: "small"                         # "small" (21M) / "base" (86M) / "large" (300M) / "giant" (1.1B)
  image_size: 224
  # dtype des POIDS de l'encodeur : "auto" = bf16 sur GPU compatible (5090),
  # fp32 sur CPU. Sorties toujours renvoyées en fp32. "float32" pour forcer.
  dtype: "auto"                         # "auto" / "float32" / "bfloat16" / "float16"
  # "sdpa" = flash attention via torch (recommandé) ; "eager" = référence
  attn_implementation: "sdpa"

# Configuration du dataset LeRobot HuggingFace
dataset:
  hf_id: "divisio74/duck_dataset_v3"
  wrist_key:   "observation.images.wrist"
  global_key:  "observation.images.front"  # ton dataset utilise "front", pas "global"
  action_key:  "action"
  proprio_key: "observation.state"
  delta_timesteps: 1
  cache_dir: null                       # null = défaut HF
  val_fraction: 0.2

# Matériel — tout est "auto" : rien à toucher sur une RTX 5090 (32 GB).
hardware:
  # Plafond électrique strict : 80 % du TGP NVIDIA par défaut (460 W sur une
  # RTX 5090 FE à 575 W). Nécessite généralement un terminal administrateur.
  # Le script refuse de démarrer si la limite ne peut pas être appliquée.
  power_limit_percent: 80
  power_limit_required: true
  gpu_index: 0
  tf32: true                            # matmuls fp32 en TF32 (Ampere+) : ~2x, précision OK
  cudnn_benchmark: true                 # autotune des kernels (shapes fixes)
  precision: "auto"                     # autocast : auto (bf16 sur GPU) / bf16 / fp16 / fp32
  data_device: "auto"                   # latents pré-encodés : auto (VRAM si ça tient) / cuda / cpu
  num_workers: "auto"                   # DataLoader d'encodage : auto (= cœurs - 2, max 8)
  compile: false                        # torch.compile du predictor (04/05) — opt-in

# Configuration des fusions à tester ( pour le cross cam)
fusion:
  strategies_to_test:
    - "concat"
    - "concat_view"
    - "cross_attn_bd"
    - "late_cls"

# Configuration entraînement du probe (Milestone 1)
probe:
  n_epochs: 30
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  hidden_dim: 512

# Reproductibilité
seed: 42

# Paths (relatifs au root du repo)
paths:
  encoded_data: "results/encoded/encoded_data.pt"
  fusion_results: "results/fusion_comparison.json"
  fusion_plot: "results/fusion_comparison.png"
